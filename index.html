const periods=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre","Année"];

const names=["","Élasticité chiffre d'affaires / REX","Rentabilité et performance","Indicateurs spécifiques aéronautique","Financement, BFR et cycle de trésorerie"];
let model=DEMO,section=1,period="Décembre",handle=null,sync=false,timer=null,lastSig="";
const $=id=>document.getElementById(id);
function fmt(v,u){if(v==null||v==="")return"–";if(typeof v==="string")return v;const n=new Intl.NumberFormat("fr-MA",{maximumFractionDigits:0});if(u==="%")return new Intl.NumberFormat("fr-MA",{style:"percent",maximumFractionDigits:1}).format(v);if(u==="jours")return n.format(v)+" j";if(u==="x"||u==="coef.")return new Intl.NumberFormat("fr-MA",{maximumFractionDigits:1}).format(v)+"x";return n.format(v)}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
function row(label){return model.reporting.find(r=>r.label===label)} function col(){return period==="Année"?"Année 2023":period}
function bc(v){if(!v||v==="–"||v==="n.s.")return"gray";if(v.includes("Proportionnel"))return"blue";if(v.includes("Marge érodée"))return"orange";if(v.includes("Sens contraire")||v.includes("chute plus vite"))return"red";return"green"}
function renderHeader(){const a=model.accueil||{};$("company").textContent=a["Nom de l’entreprise"]||a["Nom de l'entreprise"]||"AéroTech Maroc";$("subtitle").textContent=a.title||"Plan financier";$("identity").innerHTML=[a.Secteur,a.Date,a.Département,a.Responsable].filter(Boolean).map(v=>"<span>"+esc(v)+"</span>").join("")+'<span class="control">✓ Contrôles Excel</span>'}
function renderNav(){$("nav").innerHTML=names.slice(1).map((n,i)=>'<button class="'+(section===i+1?"active":"")+'" onclick="section='+(i+1)+';render()"><span class="num">0'+(i+1)+'</span><span>'+esc(n)+"</span></button>").join("")}
function renderSlicer(){$("slicer").innerHTML=periods.map((p,i)=>'<button class="'+(period===p?"active":"")+'" onclick="period=\''+p+'\';render()">'+short[i]+"</button>").join("")}
function gauge(label,value,max,display){const ratio=Math.max(0,Math.min(1,value/max)),angle=-135+ratio*270;return'<div class="gauge"><svg viewBox="0 0 180 110"><path d="M20 90 A70 70 0 0 1 160 90" fill="none" stroke="currentColor" stroke-opacity=".10" stroke-width="12" stroke-linecap="round"/><path d="M20 90 A70 70 0 0 1 160 90" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" pathLength="1" stroke-dasharray="'+ratio+' 1"/><line x1="90" y1="90" x2="90" y2="34" stroke="currentColor" stroke-width="3" transform="rotate('+angle+' 90 90)"/></svg><strong>'+display+'</strong><div>'+label+"</div></div>"}
function spark(vals,title){if(vals.length<2)return"";let min=Math.min(...vals),max=Math.max(...vals),pts=vals.map((v,i)=>(i/(vals.length-1))*100+","+ (172-((v-min)/Math.max(1,max-min))*155)).join(" ");return'<div class="chart"><h3>'+title+'</h3><svg viewBox="0 0 100 180" preserveAspectRatio="none"><line class="axis" x1="0" y1="172" x2="100" y2="172"/><polyline class="series" points="'+pts+'"/></svg></div>'}
function render(){renderHeader();renderNav();renderSlicer();$("caption").textContent="Section "+section+" · "+names[section];const rows=model.reporting.filter(r=>r.section===section),c=col();let cards=rows.map(r=>'<article class="card" onpointermove="this.style.setProperty(\\'--mx\\',(event.clientX-this.getBoundingClientRect().left)+\\'px\\');this.style.setProperty(\\'--my\\',(event.clientY-this.getBoundingClientRect().top)+\\'px\\')"><div class="label">'+esc(r.label)+'</div><div class="value">'+fmt(r.values[c],r.unit)+'</div>'+(r.benchmark?'<div class="bench">'+esc(r.benchmark)+"</div>":"")+"</article>").join("");let h='<div class="grid">'+cards+"</div>";

if(section===4){let q="";if(typeof d==="number")q+=gauge("DSO",d,120,d.toFixed(0)+" j");if(typeof cc==="number")q+=gauge("CCC",cc,120,cc.toFixed(0)+" j");h+='<div class="gauges">'+q+"</div>"}

$("content").innerHTML=h}
function monthVals(label){const r=row(label);return r?periods.slice(0,12).map(p=>r.values[p]).filter(v=>typeof v==="number"):[]}
function parseBuffer(buf,name){const wb=XLSX.read(buf,{type:"array"}),mat=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true}),a=mat("Accueil"),r=mat("Reporting"),aa={};a.forEach(x=>{if(x[1])aa[String(x[1]).trim()]=x[2]});const hi=r.findIndex(x=>String(x[0]??"").trim()==="Indicateur"),head= r[hi],ix={};periods.slice(0,12).forEach(p=>ix[p]=head.indexOf(p));const ai=head.indexOf("Année 2023");let sec=null,out=[];for(const x of r.slice(hi+1)){const lab=String(x[0]??"").trim();if(!lab)continue;const mm=lab.match(/^([1-4])\\./);if(mm){sec=+mm[1];continue}if(!sec)continue;const vals={};Object.keys(ix).forEach(p=>vals[p]=x[ix[p]]);vals["Année 2023"]=x[ai];out.push({section:sec,label:lab,unit:x[1],benchmark:x[2],values:vals})}model={accueil:{"Nom de l’entreprise":aa["Nom de l’entreprise"]||aa["Nom de l'entreprise"],Secteur:aa["Secteur"],Date:aa["Date"],Département:aa["Département"],Responsable:aa["Responsable"],title:a[1]?.[1]||"Plan financier"},reporting:out};render()}
async function link(){if(window.showOpenFilePicker){const [h]=await window.showOpenFilePicker({types:[{description:"Excel",accept:{"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx"],"application/vnd.ms-excel.sheet.macroEnabled.12":[".xlsm"]}}]});handle=h;const f=await h.getFile();lastSig=f.lastModified+":"+f.size;await parseFile(f);$("status").textContent="Fichier lié · "+h.name;toast("Fichier Excel lié")}else $("fileInput").click()}
async function parseFile(f){parseBuffer(await f.arrayBuffer(),f.name)}
async function tick(){if(!sync||!handle)return;try{const f=await handle.getFile(),sig=f.lastModified+":"+f.size;if(sig!==lastSig){await new Promise(r=>setTimeout(r,400));const f2=await handle.getFile();lastSig=f2.lastModified+":"+f2.size;await parseFile(f2);toast("Mis à jour · "+new Date().toLocaleTimeString("fr-FR"));$("status").textContent="Active · dernière mise à jour "+new Date().toLocaleTimeString("fr-FR")}}catch(e){console.warn(e)}}
function toggleSync(){sync=!sync;$("syncToggle").classList.toggle("on",sync);if(sync){$("status").textContent=handle?"Synchronisation active":"Aucun fichier lié";timer=setInterval(tick,1000)}else{if(timer)clearInterval(timer);$("status").textContent="Synchronisation en pause"}}
$("fileBtn").onclick=()=>link().catch(e=>console.warn(e));$("fileInput").onchange=e=>{const f=e.target.files?.[0];if(f)parseFile(f)};$("syncToggle").onclick=toggleSync;
window.addEventListener("keydown",e=>{if(e.key>="1"&&e.key<="4"){section=+e.key;render()}if(e.key==="a"||e.key==="A"){period="Année";render()}if(e.key==="ArrowLeft"||e.key==="ArrowRight"){let i=periods.indexOf(period),d=e.key==="ArrowRight"?1:-1;period=periods[(i+d+13)%13];render()}});
render();
</script>
